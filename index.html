<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImranDarknet | Secure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background-color: #1a1a1a;
            width: 380px;
            padding: 40px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 25px #00ff22, 0 0 5px #00ff22;
            border: 1px solid #00ff22;
        }

        .login-card h2 {
            color: #00ff22;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background-color: #050505;
            border: 1px solid #222;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: #666;
        }

        .input-group input:focus {
            border-color: #00ff22;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #00ff22;
            border: none;
            border-radius: 6px;
            color: #000000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #00cc1b;
            box-shadow: 0 0 15px #00ff22;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>ImranDarknet</h2>
        <form>
            <div class="input-group">
                <input type="text" placeholder="Email or Username" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>

</body>
</html>
